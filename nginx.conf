server {
    listen 80;
    server_name _;

    # Aumentar límites para Cloudflare y payloads grandes
    large_client_header_buffers 4 32k;
    client_max_body_size 50M;

    # Opciones proxy globales heredadas por todas las locations
    # HTTP 1.1 previene que Nginx cierre conexiones TCP con el backend y desincronice Cloudflare
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Buffers expandidos para evitar fallas 502/520 si las respuestas del login son grandes (JWT + Profile)
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    
    # Timeouts (Cloudflare espera 100s, ampliamos en Nginx para evitar cortes abruptos)
    proxy_read_timeout 120s;
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;

    # Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend Endpoints
    location /api/ {
        proxy_pass http://backend:8000/;
    }

    location /jobs {
        proxy_pass http://backend:8000/jobs;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    location /refresh {
        proxy_pass http://backend:8000/refresh;
    }

    location /auth {
        proxy_pass http://backend:8000/auth;
    }

    # Backend Docs (optional, you might want to disable this in prod)
    location /docs {
        proxy_pass http://backend:8000/docs;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }
}
